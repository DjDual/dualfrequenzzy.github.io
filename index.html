<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DualFrequenzzy — Link in Bio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red:        #e01f1f;
      --red-hot:    #ff3c3c;
      --accent:     #ff6a6a;
      --text-main:  #fff5f5;
      --text-muted: #aa8080;
      --card-bg:    rgba(255,255,255,.04);
      --card-border:rgba(255,80,80,.12);
      --radius:     14px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'DM Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text-main);
      background: #080000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Canvas de luces disco en el fondo */
    #disco-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Viñeta central para que el contenido destaque */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 65% 65% at 50% 50%, transparent 20%, rgba(6,0,0,.7) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* ─── TARJETA CENTRAL ──────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp .9s cubic-bezier(.22,.68,0,1.2) both;
    }

    /* ─── FOTO DE PERFIL ───────────────────────── */
    .avatar-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      margin-bottom: 24px;
    }

    /* Anillo rojo giratorio */
    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(
        #ff3c3c 0deg,
        transparent 80deg,
        #e01f1f 170deg,
        transparent 250deg,
        #ff3c3c 360deg
      );
      animation: spin 3.5s linear infinite;
    }

    /* Separador entre anillo e imagen */
    .avatar-gap {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: #080000;
      z-index: 1;
    }

    /* ══════════════════════════════════════
       IMAGEN: pon logo.jpg en la misma
       carpeta que este index.html
    ══════════════════════════════════════ */
    .avatar {
      position: absolute;
      inset: 6px;
      width: calc(100% - 12px);
      height: calc(100% - 12px);
      border-radius: 50%;
      object-fit: cover;
      object-position: center center;
      z-index: 2;
      background: linear-gradient(135deg, #2a0000, #150505);
    }

    /* Brillo de pulso alrededor del avatar */
    .avatar-glow {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 1px solid rgba(224,31,31,.25);
      animation: pulse-ring 2.2s ease-out infinite;
      z-index: 0;
    }

    /* ─── NOMBRE ───────────────────────────────── */
    .name {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      letter-spacing: .08em;
      line-height: 1;
      color: #fff;
      text-shadow:
        0 0 6px rgba(255,60,60,1),
        0 0 18px rgba(224,31,31,.7),
        0 0 40px rgba(224,31,31,.35);
      margin-bottom: 10px;
      text-align: center;
      animation: neon-flicker 7s ease-in-out infinite;
    }

    .bio {
      font-size: .92rem;
      font-weight: 300;
      color: var(--text-muted);
      text-align: center;
      max-width: 280px;
      line-height: 1.55;
      margin-bottom: 32px;
    }

    /* ─── SEPARADOR ────────────────────────────── */
    .divider {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--red-hot), transparent);
      box-shadow: 0 0 8px var(--red);
      margin: -14px auto 32px;
    }

    /* ─── BOTONES ──────────────────────────────── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 22px;
      border-radius: var(--radius);
      text-decoration: none;
      width: 100%;
      position: relative;
      overflow: hidden;
      cursor: pointer;

      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      font-family: var(--font-body);
      font-size: .95rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: .025em;

      box-shadow: 0 4px 24px rgba(0,0,0,.5);

      transition: transform .25s cubic-bezier(.22,.68,0,1.4),
                  box-shadow .25s ease,
                  border-color .25s ease,
                  background .25s ease;

      opacity: 0;
      animation: fadeUp .6s cubic-bezier(.22,.68,0,1.2) forwards;
    }

    .btn:nth-child(1) { animation-delay: .38s; }
    .btn:nth-child(2) { animation-delay: .52s; }
    .btn:nth-child(3) { animation-delay: .66s; }

    /* Barrido de luz */
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,60,60,.1) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform .45s ease;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.015);
      border-color: rgba(224,31,31,.5);
      background: rgba(224,31,31,.09);
      box-shadow: 0 8px 32px rgba(0,0,0,.55),
                  0 0 22px rgba(224,31,31,.3),
                  0 0 0 1px rgba(224,31,31,.3);
    }

    .btn:hover::before { transform: translateX(100%); }
    .btn:active { transform: translateY(0) scale(.98); }

    .btn-icon {
      flex-shrink: 0;
      width: 36px; height: 36px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      transition: transform .25s cubic-bezier(.22,.68,0,1.4);
    }
    .btn:hover .btn-icon { transform: scale(1.12) rotate(-4deg); }
    .btn-icon svg { width: 20px; height: 20px; display: block; }

    .btn--tiktok    .btn-icon { background: rgba(0,0,0,.6);       border: 1px solid rgba(255,255,255,.1); }
    .btn--instagram .btn-icon { background: rgba(193,53,132,.2);  border: 1px solid rgba(193,53,132,.3); }
    .btn--email     .btn-icon { background: rgba(224,31,31,.18);  border: 1px solid rgba(224,31,31,.3); }

    .btn-label { flex: 1; }
    .btn-label strong { display: block; font-weight: 500; }
    .btn-label span {
      font-size: .78rem; font-weight: 300;
      color: var(--text-muted); margin-top: 1px; display: block;
    }

    .btn-arrow {
      opacity: 0; transform: translateX(-6px);
      transition: opacity .2s ease, transform .25s ease;
      color: var(--red-hot); font-size: 1.1rem;
    }
    .btn:hover .btn-arrow { opacity: 1; transform: translateX(0); }

    /* ─── PIE ──────────────────────────────────── */
    .footer {
      margin-top: 44px;
      font-size: .72rem;
      color: rgba(180,100,100,.3);
      letter-spacing: .06em;
      text-transform: uppercase;
      text-align: center;
      animation: fadeUp .6s .8s cubic-bezier(.22,.68,0,1.2) both;
    }

    /* ─── ANIMACIONES ──────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse-ring {
      0%   { transform: scale(1);   opacity: .5; }
      70%  { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(1.25); opacity: 0; }
    }
    @keyframes neon-flicker {
      0%, 94%, 100% { opacity: 1; }
      95%  { opacity: .85; }
      96%  { opacity: 1; }
      97%  { opacity: .9; }
    }

    @media (max-width: 480px) {
      body  { padding: 32px 14px 48px; }
      .name { font-size: 2.2rem; }
    }
  </style>
</head>

  <script>
    /* ════════════════════════════════════════════
       FONDO DISCO DINÁMICO
       Luces de colores rojo/escarlata que se
       mueven lentamente + chispas de bola espejo
    ════════════════════════════════════════════ */
    const canvas = document.getElementById('disco-bg');
    const ctx    = canvas.getContext('2d');

    // Paleta: rojos, carmesí, naranja fuego, magenta oscuro
    const COLORS = [
      'rgba(220,20,20,',
      'rgba(255,50,50,',
      'rgba(180,0,0,',
      'rgba(255,80,80,',
      'rgba(255,30,70,',
      'rgba(200,0,40,',
      'rgba(255,90,20,',
      'rgba(140,0,0,',
      'rgba(200,0,80,',
    ];

    let W, H, entities = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    /* Foco de luz suave — se mueve por la pantalla */
    class Light {
      constructor(init) {
        this.reset(init);
      }
      reset(init) {
        if (init) {
          this.x = Math.random() * W;
          this.y = Math.random() * H;
        } else {
          const edge = Math.floor(Math.random() * 4);
          if      (edge === 0) { this.x = Math.random() * W; this.y = -20; }
          else if (edge === 1) { this.x = W + 20; this.y = Math.random() * H; }
          else if (edge === 2) { this.x = Math.random() * W; this.y = H + 20; }
          else                 { this.x = -20; this.y = Math.random() * H; }
        }
        this.color   = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.r       = 100 + Math.random() * 220;
        this.alpha   = .05 + Math.random() * .13;
        this.vx      = (Math.random() - .5) * 1.2;
        this.vy      = (Math.random() - .5) * 1.2;
        this.life    = 0;
        this.maxLife = 200 + Math.random() * 320;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life++;
        if (this.life > this.maxLife) this.reset(false);
        const t = this.life / this.maxLife;
        this.a = this.alpha * Math.sin(t * Math.PI);
      }
      draw() {
        const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r);
        g.addColorStop(0,   this.color + this.a + ')');
        g.addColorStop(.55, this.color + (this.a * .35) + ')');
        g.addColorStop(1,   this.color + '0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* Destello de bola de espejos */
    class Spark {
      constructor() { this.reset(); }
      reset() {
        this.x    = Math.random() * W;
        this.y    = Math.random() * H;
        this.size = .6 + Math.random() * 2.2;
        this.maxA = .3 + Math.random() * .7;
        this.life = Math.random() * 80; // inicio desplazado
        this.maxL = 50 + Math.random() * 90;
      }
      update() {
        this.life++;
        if (this.life > this.maxL) this.reset();
      }
      draw() {
        const t = this.life / this.maxL;
        const a = this.maxA * Math.sin(t * Math.PI);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle   = '#fff';
        ctx.shadowColor = 'rgba(255,100,100,.8)';
        ctx.shadowBlur  = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function init() {
      resize();
      entities = [];
      for (let i = 0; i < 16; i++) entities.push(new Light(true));
      for (let i = 0; i < 80; i++) entities.push(new Spark());
    }

    function loop() {
      // Trail oscuro — no limpiar del todo da el efecto de persistencia
      ctx.fillStyle = 'rgba(6,0,0,.2)';
      ctx.fillRect(0, 0, W, H);
      entities.forEach(e => { e.update(); e.draw(); });
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => { resize(); });
    init();
    loop();
  </script>
